name: Supply chain

on:
  push:
    branches: [main]
  pull_request:

# Nothing by default: each job asks only for what it needs
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOVULNCHECK_VERSION: v1.9.0
  COSIGN_VERSION: v3.1.4

jobs:
  test:
    name: Test and source vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Reports only vulnerabilities in code that is actually reachable from this program
      - name: govulncheck (Go code and standard library)
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  release:
    name: Build, scan, sign and attest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # OIDC identity for keyless signing (Sigstore) and provenance
      attestations: write # GitHub artifact attestations
      security-events: write # SARIF upload
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name (registries require lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything after this step refers to the image by digest, never by tag: a tag can be
      # moved to other content between two steps, a digest cannot.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Provenance and SBOM are produced explicitly below, where they are signed
          provenance: false
          sbom: false

      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false

      # Scan before signing: a signature says "this image is approved", so a vulnerable image
      # must never get one.
      - name: Vulnerability scan of the SBOM (Grype, fails on HIGH/CRITICAL)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype.sarif

      - name: Upload SARIF
        if: always() && hashFiles('grype.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: grype.sarif
          category: grype

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Keyless: Fulcio issues a short-lived certificate bound to this workflow's OIDC identity,
      # and the signature is recorded in the public Rekor transparency log. No key to leak.
      - name: Sign the image (cosign keyless)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attach the SBOM as a signed attestation
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      # SLSA build provenance: signed statement of which repository, commit and workflow
      # produced this exact digest
      - name: Build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  verify:
    name: Verify as a consumer, then try to fool the checks
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signature, SBOM, provenance and build info
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.release.outputs.image }}@${{ needs.release.outputs.digest }}
        run: bash scripts/verify.sh "$REF" "$GITHUB_REPOSITORY"

      - name: Negative tests (wrong signer, foreign image, tampered image)
        env:
          REF: ${{ needs.release.outputs.image }}@${{ needs.release.outputs.digest }}
        run: bash scripts/tamper-test.sh "$REF" "$GITHUB_REPOSITORY"
